<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 1</title>
    <style>
        table,th,td{
            border: 1px solid blue;
            border-collapse: collapse;
            border-spacing :5px;
        }
        th,td{
            padding: 5px;
            color: rgb(0, 0, 0);
        }
        th{
            background-color: rgb(93, 235, 253);
            text-align: center;
        }
        ble{width: 50%;}
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>José</td>
            <td>19</td>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>23</td>
            <td>Guarulhos</td>
        </tr>
    </table>
    
    <table style="width:1%">
            <tr>
            <th>Nome</th>
            <th colspan="2">Telefone</th>
            </tr>
            <tr>
            <td>Bill Gates</td>
            <td>55577854</td>
            <td>55577855</td>
            </tr>
            <tr>
    
    </table>
    <table>
        <tr>
            <th>Name:</th>
            <td>Bill Gates</td>
            </tr>
            <tr>
            <th rowspan="2">Telephone:</th>
            <td>55577854</td>
            </tr>
            <tr>
            <td>55577855</td>
            </tr>
    </table>



</body>
</html>
